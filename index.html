<h1>auto-news</h1>
<p>auto-news は、AI関連のニュースを毎日自動で収集・要約し、解説動画を作成して、運営者自身のYouTubeチャンネルへ投稿するための個人用ツールです。</p>
<ul>
  <li>公開されているニュース記事（RSS）を収集します。</li>
  <li>要約と台本の作成にAI（Gemini API）を使用します。</li>
  <li>音声には VOICEVOX（ずんだもん）を使用します。</li>
  <li>完成した動画は、YouTube Data API を使って運営者自身のチャンネルにのみ投稿します。</li>
</ul>
<p>このツールは運営者本人のみが利用し、第三者のアカウントへのアクセスは行いません。</p>
<p><a href="privacy.html">プライバシーポリシー</a></p>
